# The checks that need no simulator: the engine's tests and its Foundation-only rule, the
# color sets, and the String Catalogs (checked against a build for the generic simulator destination;
# a local run syncs them instead). GitHub's runners don't have the named simulators the full suite runs on
# (scripts/test.sh), so that stays a local step before each commit (AGENTS.md, Testing).
name: Checks

# Skipped when a change touches only docs or Markdown. docs/design/DESIGN.md stays in:
# the color-set check reads it. The last matching pattern wins.
on:
  pull_request:
    paths:
      - "**"
      - "!docs/**"
      - "!**/*.md"
      - "docs/design/DESIGN.md"
  push:
    branches: [main, "release/**"]
    paths:
      - "**"
      - "!docs/**"
      - "!**/*.md"
      - "docs/design/DESIGN.md"

jobs:
  checks:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      # The xcode-27 image (a GitHub public preview) has Xcode 27.x; 27.2 is the build the project
      # is developed with. The image's default is 27.1 and it also carries a 27.3 beta.
      - name: Select Xcode 27.2
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Run the checks
        run: SIMULATORS= scripts/test.sh
