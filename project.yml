name: NudgeInator
options:
  bundleIdPrefix: com.newrealityinteractive
  deploymentTarget:
    iOS: "26.1"
  generateEmptyDirectories: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: B9QHGF334U
    CODE_SIGN_STYLE: Automatic
    SDKROOT: iphoneos
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    # Every string a person sees is in a String Catalog; the compiler extracts them (scripts/sync-strings.sh).
    SWIFT_EMIT_LOC_STRINGS: YES
    # Warnings are errors: a new toolchain's warnings otherwise pass unnoticed (pace ticket 01).
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    # One version and build number for the app and the widget. The build number stays 1 here: the
    # Organizer's "Manage version and build number" raises it on upload (testflight-readiness 01).
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  NudgeEngine:
    path: Packages/NudgeEngine
  NudgeShared:
    path: Packages/NudgeShared
targets:
  NudgeInator:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: NudgeEngine
      - package: NudgeShared
      - target: NudgeWidgets
        embed: true
    entitlements:
      path: App/NudgeInator.entitlements
      properties:
        com.apple.developer.usernotifications.time-sensitive: true
        com.apple.security.application-groups:
          - group.com.newrealityinteractive.nudgeinator
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Nudge-inator
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Export compliance: the only cryptography is Insecure.SHA1 for alarm IDs, and nothing goes
        # over a network. A feature that adds either revisits this (testflight-readiness 01).
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSAlarmKitUsageDescription: "Nudge-inator rings an alarm to keep nudging you about a reminder until you mark it done."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.newrealityinteractive.nudgeinator
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # The Color statics are written by hand in App/Design/DesignColors.swift.
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
        TARGETED_DEVICE_FAMILY: "1"
  NudgeWidgets:
    type: app-extension
    platform: iOS
    sources: [NudgeWidgets]
    dependencies:
      - package: NudgeShared
    entitlements:
      path: NudgeWidgets/NudgeWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.newrealityinteractive.nudgeinator
    info:
      path: NudgeWidgets/Info.plist
      properties:
        CFBundleDisplayName: Nudge-inator Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.newrealityinteractive.nudgeinator.widgets
        TARGETED_DEVICE_FAMILY: "1"
  NudgeInatorTests:
    type: bundle.unit-test
    platform: iOS
    sources: [NudgeInatorTests]
    dependencies:
      - target: NudgeInator
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.newrealityinteractive.nudgeinator.tests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  NudgeInator:
    build:
      targets:
        NudgeInator: all
        NudgeWidgets: all
        NudgeInatorTests: [test]
    test:
      targets: [NudgeInatorTests]
